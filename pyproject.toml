[project]
name = "my-fastapi-base"
version = "1.0.0"
description = "Base FastAPI template — auth JWT RS256, roles, rate limiting."
readme = "README.md"
requires-python = ">=3.13"
authors = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "sqlmodel>=0.0.31",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.2.1",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
    "fastapi-mail>=1.4.0",
    "slowapi>=0.1.9",
    "redis>=4.0.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.0.0",
    "mypy-extensions>=1.0.0",
    "pydantic[mypy]>=2.0.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ERA"]
ignore = [
    "B008",   # Depends() dans les default args — pattern FastAPI legitime
    "N805",   # cls dans les @classmethod validators Pydantic
    "N818",   # AppException : suffixe Exception valide (pas seulement Error)
    "UP046",  # Generic[T] requis par Pydantic v2 (PEP 695 non supporte)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]  # assert et longues lignes autorises dans les tests
"src/conf/migrations.py" = ["ERA001"]  # bloc exemple intentionnellement commente

[tool.coverage.run]
source = ["src"]
omit = ["src/scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
targets = ["src"]
skips = []

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = false
plugins = ["pydantic.mypy"]
